spring:
  application:
    name: salary-management

  datasource:
    url: jdbc:sqlite:salary.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; one connection avoids "database is locked" errors
      maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  seed:
    enabled: true
    count: 10000
  security:
    demo-manager-password: ${DEMO_MANAGER_PASSWORD:}
    demo-viewer-password: ${DEMO_VIEWER_PASSWORD:}
    manager-emails: ${MANAGER_EMAILS:}
    viewer-emails: ${VIEWER_EMAILS:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

